[alembic]
script_location = app/db/migrations
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic,app
# Python 3.12's fileConfig() does NOT read disable_existing_loggers from the INI.
# The actual fix is in env.py: fileConfig(..., disable_existing_loggers=False).
# This key is documented here for intent clarity but has no runtime effect.
disable_existing_loggers = false

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_app]
level = INFO
handlers =
qualname = app

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
