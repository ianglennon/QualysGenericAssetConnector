# Runs the prebuilt images published to GHCR by .github/workflows/docker-publish.yml.
# No source checkout needed: copy this file and a .env (see .env.example) to the host, then
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
# Pin a release with IMAGE_TAG (e.g. IMAGE_TAG=sha-c810c0a or 1.2.0); defaults to latest.

# Separate project name so a dev `docker compose up` in the source checkout
# does not take over these containers or the database volume.
name: qualys-connector

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qualys
      POSTGRES_USER: ${POSTGRES_USER:-qualys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualys} -d qualys"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    expose:
      - "5432"
    restart: unless-stopped

  backend:
    image: ghcr.io/ianglennon/qualys-connector-backend:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qualys}:${POSTGRES_PASSWORD}@db:5432/qualys
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY must be set}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: ghcr.io/ianglennon/qualys-connector-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
